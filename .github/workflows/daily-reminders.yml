name: Daily Push Reminders

on:
  # Fixed daily slots (UTC). Israel is UTC+3, so:
  # 09:00 IL = 06:00 UTC | 12:00 IL = 09:00 UTC | 15:00 IL = 12:00 UTC
  # 18:00 IL = 15:00 UTC | 21:00 IL = 18:00 UTC
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$VITE_WEB_PUSH_PUBLIC_KEY" || (echo "Missing VITE_WEB_PUSH_PUBLIC_KEY" && exit 1)
          test -n "$WEB_PUSH_PRIVATE_KEY" || (echo "Missing WEB_PUSH_PRIVATE_KEY" && exit 1)
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing Supabase secrets and FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          fi

      - name: Send Daily Push Reminders
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          FORCE_ALL_USERS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          WEB_PUSH_SUBJECT:     ${{ secrets.WEB_PUSH_SUBJECT }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
          SUPABASE_PUSH_SUBSCRIPTIONS_TABLE: ${{ secrets.SUPABASE_PUSH_SUBSCRIPTIONS_TABLE }}
          SUPABASE_NOTIFICATION_SETTINGS_TABLE: ${{ secrets.SUPABASE_NOTIFICATION_SETTINGS_TABLE }}
          PUSH_APP_BASE_URL:    ${{ secrets.PUSH_APP_BASE_URL }}
          # Timezone offset in hours (e.g. 3 for Israel UTC+3).
          # Users' reminder times are stored in this timezone.
          REMINDER_TIMEZONE_OFFSET_HOURS: ${{ secrets.REMINDER_TIMEZONE_OFFSET_HOURS }}
        run: node scripts/run-daily-reminders.mjs
