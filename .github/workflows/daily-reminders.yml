name: Daily Push Reminders

on:
  # Runs every 15 minutes — GitHub Actions cron runs in UTC.
  # Adjust REMINDER_TIMEZONE_OFFSET_HOURS in the env section below
  # if your users' reminder times are stored in a non-UTC timezone.
  schedule:
    - cron: '*/15 * * * *'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$VITE_WEB_PUSH_PUBLIC_KEY" || (echo "Missing VITE_WEB_PUSH_PUBLIC_KEY" && exit 1)
          test -n "$WEB_PUSH_PRIVATE_KEY" || (echo "Missing WEB_PUSH_PRIVATE_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Send Daily Push Reminders
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT:     ${{ secrets.WEB_PUSH_SUBJECT }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_APP_BASE_URL:    ${{ secrets.PUSH_APP_BASE_URL }}
          # Timezone offset in hours (e.g. 3 for Israel UTC+3).
          # Users' reminder times are stored in this timezone.
          REMINDER_TIMEZONE_OFFSET_HOURS: ${{ secrets.REMINDER_TIMEZONE_OFFSET_HOURS }}
        run: node scripts/run-daily-reminders.mjs
