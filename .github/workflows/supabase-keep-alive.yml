name: Scheduled Supabase Ping

on:
  schedule:
    # Runs at 12:00 PM (UTC) every Monday, Wednesday, and Friday
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Enables a manual trigger button in GitHub

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase API REST Endpoint
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL_MIDHD }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY_MIDHD }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_MIDHD }}" \
          -I
